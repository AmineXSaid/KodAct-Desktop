<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diagram</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f9f7f5;   /* Forge stage */
      --color-ink:     #1c1b19;   /* Forge ink */
      --color-muted:   #615d59;   /* Forge graphite */
      --color-accent:  #005fb3;   /* Forge blue, a step deeper */
      --font-sans:     'Anthropic Sans Text';
      --font-serif:    'Anthropic Sans Display';
      --font-mono:     'Anthropic Sans Text';
    }

    body {
      font-family:'Anthropic Sans Text';
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }
    /* The SVG holds its readable width (min-width == the viewBox width, so the
       type ramp is never silently scaled down). This wrapper lets a narrow
       screen scroll the diagram instead of the whole page. */
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family:'Anthropic Sans Text';
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family:'Anthropic Sans Display';
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 960px; display: block; }
    /* Paper has no scrollbar, so the local scroller would clip instead of
       scroll. Let the diagram scale down to the sheet: smaller but whole
       beats sharp but cut off. Must come after the svg rule above - a media
       query adds no specificity, so a later plain rule would win. */
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">[Type] · Diagram Design</p>
    <h1>[Diagram title]</h1>

    <!-- Replace [diagram-slug] with a unique slug for this diagram before export. -->
    <div class="diagram-container">
      <svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="[diagram-slug]-title [diagram-slug]-desc">
        <title id="[diagram-slug]-title">[Diagram title]</title>
        <desc id="[diagram-slug]-desc">[One sentence describing what the diagram shows]</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#615d59"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#005fb3"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#6a4fb4"/></marker>

          <!-- OPTIONAL: dot-pattern background. Uncomment the <pattern> and the second <rect> below if you want the dotted paper look. -->
          <!--
          <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.9" fill="rgba(28,27,25,0.10)"/>
          </pattern>
          -->
        </defs>

        <rect width="100%" height="100%" fill="#f9f7f5"/>
        <!-- <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/> -->

        <!-- Draw arrows first, then nodes. Replace with your content. -->

      </svg>
    </div>
  </div>
</body>
</html>
