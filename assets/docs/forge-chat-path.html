<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>How a chat reaches a model</title>
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;1,8..60,400&family=Hanken+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f9f7f5;   /* Forge stage */
      --color-ink:     #1c1b19;   /* Forge ink */
      --color-muted:   #615d59;   /* Forge graphite */
      --color-accent:  #005fb3;   /* Forge blue, a step deeper */
      --font-sans:     'Hanken Grotesk', system-ui, sans-serif;
      --font-serif:    'Source Serif 4 Display', 'Source Serif 4', serif;
      --font-mono:     'JetBrains Mono', ui-monospace, monospace;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 960px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · Diagram Design</p>
    <h1>How a chat reaches a model</h1>
    <div class="diagram-container">
      <svg viewBox="0 0 960 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="chat-path-title chat-path-desc">
        <title id="chat-path-title">How a chat reaches a model</title>
        <desc id="chat-path-desc">Forge starts the claude CLI, the CLI calls Forge's local gateway with no key, and the gateway adds the key from Windows Credential Manager before it forwards the request to the endpoint you picked.</desc>
        <defs>
          <marker id="cp-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#615d59"/></marker>
          <marker id="cp-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#005fb3"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f9f7f5"/>

        <!-- Boundary: everything on this PC. -->
        <rect x="24" y="48" width="664" height="400" rx="8" fill="none" stroke="#c9c4bd" stroke-width="1" stroke-dasharray="4 4"/>
        <text x="40" y="72" fill="#6f6a64" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" letter-spacing="0.18em" font-weight="500">THIS PC</text>
        <text x="760" y="72" fill="#6f6a64" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" letter-spacing="0.18em" font-weight="500">ENDPOINTS</text>

        <!-- Arrows first, then nodes. -->
        <line x1="216" y1="216" x2="276" y2="216" stroke="#615d59" stroke-width="1.2" marker-end="url(#cp-arrow)"/>
        <line x1="440" y1="216" x2="508" y2="216" stroke="#615d59" stroke-width="1.2" marker-end="url(#cp-arrow)"/>
        <line x1="592" y1="356" x2="592" y2="260" stroke="#005fb3" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#cp-arrow-accent)"/>
        <path d="M 672 200 C 712 200, 712 128, 748 128" fill="none" stroke="#615d59" stroke-width="1.2" marker-end="url(#cp-arrow)"/>
        <line x1="672" y1="216" x2="748" y2="232" stroke="#615d59" stroke-width="1.2" marker-end="url(#cp-arrow)"/>
        <path d="M 672 232 C 712 232, 712 336, 748 336" fill="none" stroke="#615d59" stroke-width="1.2" marker-end="url(#cp-arrow)"/>

        <!-- Arrow labels, each on a paper mask. -->
        <rect x="216" y="180" width="64" height="16" fill="#f9f7f5"/>
        <text x="248" y="192" fill="#615d59" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">STDIO</text>
        <rect x="440" y="180" width="72" height="16" fill="#f9f7f5"/>
        <text x="476" y="192" fill="#615d59" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">NO KEY</text>
        <rect x="600" y="300" width="72" height="16" fill="#f9f7f5"/>
        <text x="604" y="312" fill="#005fb3" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" letter-spacing="0.08em">READS KEY</text>
        <rect x="684" y="204" width="56" height="16" fill="#f9f7f5"/>
        <text x="712" y="216" fill="#615d59" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">+ KEY</text>

        <!-- Forge -->
        <rect x="56" y="176" width="160" height="80" rx="6" fill="#f9f7f5" stroke="#1c1b19" stroke-width="1"/>
        <text x="136" y="212" fill="#1c1b19" font-size="12" font-weight="600" font-family="'Hanken Grotesk', system-ui, sans-serif" text-anchor="middle">Forge</text>
        <text x="136" y="232" fill="#6f6a64" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">Rust · GPUI</text>

        <!-- claude CLI -->
        <rect x="280" y="176" width="160" height="80" rx="6" fill="#f9f7f5" stroke="#1c1b19" stroke-width="1"/>
        <text x="360" y="212" fill="#1c1b19" font-size="12" font-weight="600" font-family="'Hanken Grotesk', system-ui, sans-serif" text-anchor="middle">claude CLI</text>
        <text x="360" y="232" fill="#6f6a64" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">stream-json</text>

        <!-- Gateway: the focal node. -->
        <rect x="512" y="176" width="160" height="80" rx="6" fill="rgba(0,95,179,0.08)" stroke="#005fb3" stroke-width="1.2"/>
        <text x="592" y="212" fill="#1c1b19" font-size="12" font-weight="600" font-family="'Hanken Grotesk', system-ui, sans-serif" text-anchor="middle">Gateway</text>
        <text x="592" y="232" fill="#005fb3" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">127.0.0.1 · adds the key</text>

        <!-- Credential Manager -->
        <rect x="512" y="360" width="160" height="64" rx="6" fill="#f1efeb" stroke="#c9c4bd" stroke-width="1"/>
        <text x="592" y="388" fill="#1c1b19" font-size="12" font-weight="600" font-family="'Hanken Grotesk', system-ui, sans-serif" text-anchor="middle">Credential Manager</text>
        <text x="592" y="406" fill="#6f6a64" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">Windows · your keys</text>

        <!-- Endpoints -->
        <rect x="752" y="96" width="176" height="64" rx="6" fill="#f9f7f5" stroke="#1c1b19" stroke-width="1"/>
        <text x="840" y="124" fill="#1c1b19" font-size="12" font-weight="600" font-family="'Hanken Grotesk', system-ui, sans-serif" text-anchor="middle">Qwen3 Coder</text>
        <text x="840" y="142" fill="#6f6a64" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">workstation:8000</text>
        <rect x="752" y="200" width="176" height="64" rx="6" fill="#f9f7f5" stroke="#1c1b19" stroke-width="1"/>
        <text x="840" y="228" fill="#1c1b19" font-size="12" font-weight="600" font-family="'Hanken Grotesk', system-ui, sans-serif" text-anchor="middle">gpt-oss 120B</text>
        <text x="840" y="246" fill="#6f6a64" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">localhost:11434</text>
        <rect x="752" y="304" width="176" height="64" rx="6" fill="#f9f7f5" stroke="#1c1b19" stroke-width="1"/>
        <text x="840" y="332" fill="#1c1b19" font-size="12" font-weight="600" font-family="'Hanken Grotesk', system-ui, sans-serif" text-anchor="middle">DeepSeek V3.2</text>
        <text x="840" y="350" fill="#6f6a64" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">api.deepseek.com</text>
      </svg>
    </div>
  </div>
</body>
</html>
