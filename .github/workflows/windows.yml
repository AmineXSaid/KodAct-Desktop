# The gates and the Windows build.
#
# `checks` (Linux) runs on every push and pull request: rustfmt, clippy with
# warnings as errors, a debug build, then the tests. A red check is a broken
# commit.
#
# `build` (Windows) makes KodAct's .exe with MSVC and the Windows SDK (GPUI
# compiles its shaders with the SDK's fxc.exe in release builds). A push to
# main keeps it as an artifact for 30 days and puts it on the `windows-build`
# branch (one commit, replaced each time), so it can also be fetched with
# plain git. Then clippy and the tests run, on Windows.

name: Windows build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-build
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # GPUI on Linux: fontconfig, xkbcommon (with X11) and the X11 and
      # Wayland libraries it links.
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libfontconfig1-dev libfreetype-dev \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libx11-dev libx11-xcb-dev libxcb1-dev libxcb-xkb-dev \
            libwayland-dev libvulkan-dev

      - name: Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
          rustc --version

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Build (no warnings)
        env:
          RUSTFLAGS: -D warnings
        run: cargo build --locked

      - name: Test
        env:
          RUSTFLAGS: -D warnings
        run: cargo test --locked

  build:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable
          rustc --version

      # Only GitHub's own actions are allowed on this account.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Build
        run: cargo build --release --locked

      - name: Describe the .exe
        shell: pwsh
        run: |
          $exe = "target/release/kodact-desktop.exe"
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          $size = (Get-Item $exe).Length
          @(
            "commit: $env:GITHUB_SHA",
            "sha256: $hash",
            "bytes: $size",
            "built: windows-latest, cargo build --release --locked, $(rustc --version)"
          ) | Tee-Object -FilePath BUILD.txt

      - uses: actions/upload-artifact@v4
        with:
          name: KodAct-windows-x64
          retention-days: 30
          path: |
            target/release/kodact-desktop.exe
            BUILD.txt

      - name: Publish to the windows-build branch
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir publish
          cp target/release/kodact-desktop.exe BUILD.txt publish/
          cd publish
          git init -q -b windows-build
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kodact-desktop.exe BUILD.txt
          git commit -q -m "Windows build of ${GITHUB_SHA::7}"
          git push --force -q "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" windows-build

      - name: Clippy
        run: cargo clippy --release --locked --all-targets -- -D warnings

      - name: Test
        run: cargo test --release --locked
