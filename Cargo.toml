[package]
name = "kodact-desktop"
version = "0.1.0"
default-run = "kodact-desktop"
edition = "2021"
description = "KodAct desktop: the desktop app for the KodAct CLI, in GPUI."
license = "UNLICENSED"
publish = false

# KodAct's setup (installer/setup): its own window; `installer/build.sh` appends what it
# installs to the .exe. The app itself is src/main.rs.
[[bin]]
name = "kodact-setup"
path = "installer/setup/main.rs"

[dependencies]
# GPUI Kit (Apache-2.0) re-exports its pinned GPUI snapshot (`gpui-pre` 0.3.8)
# and gpui-component. Aliased as `gpui`, as its README advises, so `use gpui::...`
# and GPUI's macros resolve through it.
gpui = { package = "gpui-kit", version = "=0.7.1" }
# Code coloured in the file view's editor: the kit's component crate with
# its tree-sitter grammars (Rust, Python, JS/TS, Go, C/C++, Java, HTML, CSS,
# SQL, YAML, TOML, Bash and more; each grammar MIT). Same pinned version as
# the kit uses, so the feature joins the kit's own copy.
gpui-component = { version = "=0.7.1", default-features = false, features = ["tree-sitter-languages"] }
pulldown-cmark = { version = "0.13", default-features = false }
# The Rules screen: rule globs, and walking a project the way git sees it.
globset = "=0.4.20"
ignore = "=0.4.33"
# Code blocks: Sublime grammars (syntect) plus bat's extra ones (two-face:
# TypeScript, TOML, Kotlin, Swift, Dockerfile, ...), pure-Rust regex.
syntect = { version = "=5.3.0", default-features = false, features = ["parsing", "regex-fancy"] }
two-face = { version = "=0.5.2", default-features = false, features = ["syntect-fancy"] }
# Endpoint profiles and their health record; the model check's HTTP call.
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
ureq = { version = "=2.12.1", default-features = false, features = ["tls", "json"] }
# Settings > Models > Diagnose: a TLS handshake of its own, with the same
# rustls and roots ureq uses (no new code in the build).
rustls = { version = "=0.23.45", default-features = false, features = ["ring", "std", "tls12", "logging"] }
webpki-roots = "=0.26.11"
url = "=2.5.8"
# The local hour, for the new-chat greeting.
chrono = { version = "=0.4.45", default-features = false, features = ["clock"] }
# Office files and PDFs KodAct made, read for the side panel (office.rs):
# spreadsheets (calamine), Word and PowerPoint XML (zip, quick-xml), PDF text (lopdf).
calamine = { version = "=0.36.1", default-features = false }
# Attachments (stage.rs) also open archives with it: the pure-Rust codecs
# only (deflate, deflate64, bzip2, lzma, xz).
zip = { version = "=8.6.0", default-features = false, features = ["deflate", "deflate64", "bzip2", "lzma", "xz"] }
quick-xml = "=0.41.0"
lopdf = { version = "=0.45.0", default-features = false }
# PDF pages drawn as pictures in the side panel (hayro: pure Rust, MIT/Apache-2.0).
hayro = "=0.8.0"
# The live browser in the side panel talks to Chromium over the DevTools
# protocol, a WebSocket (web_view.rs; tungstenite, MIT/Apache-2.0).
# The terminal dock: pseudo-terminals (ConPTY on Windows) and the terminal
# emulator (grid, scrollback, escape sequences). MIT and Apache-2.0.
portable-pty = "=0.9.0"
alacritty_terminal = "=0.26.0"
# SHA-256 of the KodAct CLI uploaded to a remote, checked against the copy
# there. Already built for rustls; named here at the same pin. ISC-style.
ring = { version = "=0.17.14", default-features = false }
tungstenite = { version = "=0.30.0", default-features = false, features = ["handshake"] }
# Attachments (stage.rs): .tar, .tar.gz and .gz (tar, flate2; MIT/Apache-2.0)
# and .7z (sevenz-rust2, Apache-2.0, pure Rust) are opened for the model. RAR
# has no permissively licensed decoder: an installed 7-Zip, unrar or bsdtar
# opens it. Big pictures are scaled down before they're sent (image, MIT/Apache-2.0).
tar = { version = "=0.4.46", default-features = false }
flate2 = "=1.1.10"
# Figma files' zstd chunks (`design/fig.rs`); pure Rust (ruzstd, MIT).
ruzstd = "=0.8.1"
# Cloudflare Pages keys uploaded files by a BLAKE3 hash (`design/services.rs`);
# the pure-Rust build (blake3, CC0/Apache-2.0).
blake3 = { version = "=1.8.5", default-features = false, features = ["std", "pure"] }
sevenz-rust2 = { version = "=0.24.0", default-features = false, features = ["bzip2", "deflate"] }
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
# Events from each chat's KodAct CLI process to the UI (backend.rs).
async-channel = "=2.5.0"
# The design library's SKILL.md and DESIGN.md front-matter is real YAML
# (nested maps, block text, lists): src/design/frontmatter.rs. Pure Rust,
# YAML 1.2, MIT/Apache-2.0.
yaml-rust2 = { version = "=0.13.0", default-features = false }

# Endpoint keys, in Windows Credential Manager (secrets.rs). MIT/Apache-2.0.
[target.'cfg(windows)'.dependencies]
keyring = { version = "=3.6.3", default-features = false, features = ["windows-native"] }

[build-dependencies]
# The Windows .exe icon (build.rs): assets/kodact.rc compiled in. MIT.
embed-resource = "=3.0.12"

[dev-dependencies]
# Tests only: decode the cube picture and its renderings to check them pixel by pixel.
image = { version = "=0.25.10", default-features = false, features = ["png", "webp"] }

[profile.dev]
# GPUI is heavy in debug; optimise dependencies, keep our crate fast to build.
opt-level = 0
[profile.dev.package."*"]
opt-level = 2

# GPUI's Windows renderer, with its shaders compiled at runtime when the
# build had no fxc.exe (a cross-compiled .exe). vendor/gpui-pre-windows/KODACT-CHANGES.md.
[patch.crates-io]
gpui-pre-windows = { path = "vendor/gpui-pre-windows" }
