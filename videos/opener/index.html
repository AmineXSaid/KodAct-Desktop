<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Forge</title>
    <!-- Vendored runtimes: nothing loads from the network at render time. -->
    <script src="vendor/gsap.min.js"></script>
    <script src="kit/film.js"></script>
    <script src="kit/motion.js"></script>
    <script src="kit/words.js"></script>
    <script src="kit/draw.js"></script>
    <script src="kit/fx.js"></script>
    <script src="kit/three.js"></script>
    <script src="kit/debug.js"></script>
    <script src="cues.js"></script>
    <style>
      /* Forge's own fonts (forge-gpui/assets/fonts, OFL). */
      @font-face { font-family: "Hanken Grotesk"; src: url("assets/fonts/HankenGrotesk-Regular.ttf") format("truetype"); font-weight: 400; font-display: block; }
      @font-face { font-family: "Hanken Grotesk"; src: url("assets/fonts/HankenGrotesk-SemiBold.ttf") format("truetype"); font-weight: 600; font-display: block; }
      @font-face { font-family: "Hanken Grotesk"; src: url("assets/fonts/HankenGrotesk-Bold.ttf") format("truetype"); font-weight: 700; font-display: block; }
      @font-face { font-family: "Source Serif 4 Display"; src: url("assets/fonts/SourceSerif4Display-Regular.ttf") format("truetype"); font-weight: 400; font-display: block; }
      @font-face { font-family: "JetBrains Mono"; src: url("assets/fonts/JetBrainsMono-Regular.ttf") format("truetype"); font-weight: 400; font-display: block; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #262624; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #262624; color: #ecebe6; font-family: "Hanken Grotesk", sans-serif; }
      .full { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: hidden; }
      /* Words: Forge's sans, bold, sentence case, calm voice at showreel size. */
      .head { position: absolute; left: 0; right: 0; top: 150px; text-align: center; font-weight: 700; font-size: 168px; line-height: 1; letter-spacing: -0.02em; white-space: nowrap; color: #ecebe6; visibility: hidden; }
      #check { position: absolute; width: 128px; height: 128px; visibility: hidden; }
      #lockup { background: #262624; visibility: hidden; }
      .wm { position: absolute; top: 455px; font-family: "Source Serif 4 Display", serif; font-size: 190px; line-height: 1; color: #ecebe6; white-space: nowrap; }
      #tag { position: absolute; left: 0; right: 0; top: 700px; text-align: center; font-size: 36px; color: #a8a59c; }
      #mark { position: absolute; left: 0; top: 0; width: 132px; height: 132px; transform-origin: 0 0; visibility: hidden; }
      #titlebar { position: absolute; left: 0; top: 0; width: 1920px; height: 54px; background: #141312; border-bottom: 1px solid rgba(255,255,255,.1); }
      #question { position: absolute; left: 0; right: 0; top: 430px; text-align: center; font-family: "Source Serif 4 Display", serif; font-size: 44px; color: #ffffff; }
      #question span { display: inline-block; }
      #field { position: absolute; left: 645px; top: 520px; width: 630px; height: 78px; border-radius: 18px; background: #30302e; border: 2px solid #8ecacd; }
      #field .ph { position: absolute; left: 30px; top: 25px; font-size: 22px; color: #7d7a72; }
      #field .caret { position: absolute; left: 28px; top: 22px; width: 2px; height: 34px; background: #8ecacd; }
      #field .go { position: absolute; right: 12px; top: 10px; width: 54px; height: 54px; border-radius: 12px; background: #3a3a37; }
      #orbit { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="12.9" data-width="1920" data-height="1080">
      <!-- Layers, bottom to top: the 3D world > words > the lockup and naming screen > grain > HUD. -->
      <canvas id="three" data-layout-allow-overflow width="1920" height="1080" class="full"></canvas>
      <div id="words" class="full">
        <div id="w1" class="head">Describe it.</div>
        <div id="w2" class="head">Forge builds it.</div>
        <div id="w3" class="head">You approve.</div>
        <svg id="check" viewBox="0 0 128 128"><path d="M14 66 L50 100 L116 24" fill="none" stroke="#8ecacd" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" pathLength="1" /></svg>
      </div>
      <div id="lockup" class="full">
        <div id="titlebar" data-layout-ignore></div>
        <svg id="orbit" viewBox="0 0 1920 1080" data-layout-ignore>
          <ellipse cx="960" cy="388" rx="117" ry="34" fill="none" stroke="#7d7a72" stroke-width="1.5" stroke-dasharray="3 8" />
          <circle id="spark" r="3.4" fill="#8ecacd" />
        </svg>
        <div id="wf" class="wm">f</div>
        <div id="wrge" class="wm">rge</div>
        <div id="tag">Forge asks before it changes anything.</div>
        <div id="question"></div>
        <div id="field"><div class="caret"></div><div class="ph">Your name</div><div class="go"></div></div>
      </div>
      <!-- The ingot, flat and exact (src/ui/ingot.rs, dark theme colours). -->
      <svg id="mark" viewBox="0 0 64 64">
        <path fill="#ecebe6" d="M9.4 19.4 31.2 32v25.6L9.4 45z" />
        <path fill="#6f6c64" d="M54.6 19.4 32.8 32v25.6L54.6 45z" />
        <path fill="#529a9d" d="M32 6.2 53.6 18.6 32 31 10.4 18.6z" />
      </svg>
      <canvas id="grain" class="full" width="640" height="360" data-layout-ignore style="width:100%;height:100%;opacity:0.05"></canvas>
      <div id="hud-layer" class="full" data-layout-ignore></div>
      <script type="importmap">
        { "imports": { "three": "./vendor/three/three.module.min.js" } }
      </script>
      <script type="module">
        import * as THREE from "three";
        import { EffectComposer } from "./vendor/three/addons/postprocessing/EffectComposer.js";
        import { RenderPass } from "./vendor/three/addons/postprocessing/RenderPass.js";
        import { UnrealBloomPass } from "./vendor/three/addons/postprocessing/UnrealBloomPass.js";
        import { OutputPass } from "./vendor/three/addons/postprocessing/OutputPass.js";
        import { RoomEnvironment } from "./vendor/three/addons/environments/RoomEnvironment.js";
        window.THREE = THREE;
        window.THREE_ADDONS = { EffectComposer, RenderPass, UnrealBloomPass, OutputPass, RoomEnvironment };
        PF.signal("three").resolve();
      </script>
      <!-- pf:audio -->
      <!-- /pf:audio -->
    </div>
    <script>
      const b = PF.grid(CUES.grid);
      const $ = PF.$;
      const W = CUES.width, H = CUES.height;
      // forge-gpui tokens (src/theme.rs, dark), as hex.
      const C = { stage: "#262624", chrome: "#141312", pane: "#1d1c1b", paper: "#ecebe6", muted: "#a8a59c", dot: "#9a958b",
        top: "#529a9d", right: "#6f6c64", teal: "#8ecacd", accent: "#216d70",
        white: "#fff2cc", glow: "#f5892c", ember: "#a3311c", iron: "#3b3633" };
      // Times, all from the grid.
      const LAND = b(2, 1), HIT = b(3, 4), COOLED = b(5, 3), LOCK = b(6, 1), PART = b(6, 4), NAME = b(7, 1);
      const easeIO = PF.bezier(0.65, 0, 0.35, 1), easeOut = PF.bezier(0.2, 0.8, 0.2, 1), easeIn = PF.bezier(0.55, 0, 1, 0.45);
      // Heat, as ingot.rs: white 1, glow 2/3, ember 1/3, iron 0.12, then the face's own colour.
      function glowing(cool, h) {
        h = PF.clamp01(h); const IRON = 0.12;
        if (h <= IRON) return PF.mix(cool, C.iron, h / IRON);
        const s = [[IRON, C.iron], [1 / 3, C.ember], [2 / 3, C.glow], [1, C.white]];
        let i = s.findIndex((x) => h <= x[0]); if (i < 1) i = 3;
        return PF.mix(s[i - 1][1], s[i][1], (h - s[i - 1][0]) / (s[i][0] - s[i - 1][0]));
      }
      const heatAt = (t) => (t < HIT ? 1 : 1 - PF.clamp01((t - HIT) / (COOLED - HIT)));

      let st, hud, S = {};
      const ANVIL_TOP = 1.0, INGOT = 0.9, INGOT_Y = ANVIL_TOP + INGOT / 2, FINAL = 1.15, FINAL_Y = ANVIL_TOP + FINAL / 2;
      const PIVOT = [-3.2, 3.6, 0.25], REACH = 3.42, SHOULDER = [-11, 2.4, 0.25];
      const REST = -55, BACK = 150, HITA = -20.9;

      function setup() {
        hud = PF.hud($("#hud-layer"), { size: 20, font: '"JetBrains Mono", monospace', color: "rgba(236,235,230,.55)" });
        st = PF.three.stage($("#three"), { width: W, height: H, fov: 35, env: true, bloom: { strength: 0.55, radius: 0.32, threshold: 1.0 }, exposure: 0.95 });
        const T = st.THREE, s = st.newScene();
        S.scene = s; st.use(s);
        s.background = new T.Color(C.stage);
        s.fog = new T.Fog(C.stage, 14, 34);
        s.environmentIntensity = 0.45;
        PF.three.lights(st, { scene: s, ground: C.stage, fill: 0.35, key: 1.1, keyPos: [-5, 9, 6] });

        // The floor and its dot field (the app's home-screen pattern, laid flat).
        const floor = new T.Mesh(new T.PlaneGeometry(80, 80), new T.MeshStandardMaterial({ color: C.stage, roughness: 0.92, metalness: 0 }));
        floor.rotation.x = -Math.PI / 2; s.add(floor);
        const NX = 72, NZ = 44, dots = [];
        for (let i = 0; i < NX; i++) for (let k = 0; k < NZ; k++) dots.push([-12.6 + i * 0.35, -9 + k * 0.35]);
        S.dots = PF.three.particles(st, dots.length, { scene: s, size: 0.05, color: () => C.dot,
          pos: (i, t, o) => {
            const [x, z] = dots[i], d = Math.hypot(x, z);
            let lift = 0;
            for (const at of [LAND, HIT, COOLED]) { const a = t - at; if (a < 0 || a > 1.6) continue; const r = a * 9, band = Math.max(0, 1 - Math.abs(d - r) / 0.7); lift += 0.28 * band * (1 - a / 1.6); }
            o.x = x; o.y = 0.02 + lift; o.z = z;
          } });

        // The anvil: dark iron, two blocks.
        const iron = PF.three.mat("metal", C.iron, { roughness: 0.42 });
        const base = new T.Mesh(new T.BoxGeometry(1.3, 0.55, 0.9), iron); base.position.set(0, 0.275, 0);
        const top = new T.Mesh(new T.BoxGeometry(2.5, 0.45, 1.15), iron); top.position.set(0, 0.775, 0);
        s.add(base, top);

        // The star: a raw rock in a teal aura.
        const rock = new T.IcosahedronGeometry(0.55, 1), rnd = PF.random(42), pa = rock.attributes.position;
        for (let i = 0; i < pa.count; i++) { const k = 0.78 + rnd() * 0.42; pa.setXYZ(i, pa.getX(i) * k, pa.getY(i) * k, pa.getZ(i) * k); }
        rock.computeVertexNormals();
        S.rockMat = new T.MeshPhysicalMaterial({ color: C.pane, roughness: 0.85, metalness: 0.2, flatShading: true, emissive: new T.Color(C.teal), emissiveIntensity: 0.15 });
        S.star = new T.Mesh(rock, S.rockMat); s.add(S.star);
        // The aura: a soft round glow that always faces the camera.
        const glowTex = PF.three.canvasTexture(st, 128, 128, (g, w, h) => { const r = g.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, w / 2);
          r.addColorStop(0, "rgba(255,255,255,0.9)"); r.addColorStop(0.35, "rgba(255,255,255,0.35)"); r.addColorStop(1, "rgba(255,255,255,0)"); g.fillStyle = r; g.fillRect(0, 0, w, h); });
        S.aura = new T.Sprite(new T.SpriteMaterial({ map: glowTex, color: new T.Color(C.teal), transparent: true, depthWrite: false, blending: T.AdditiveBlending }));
        S.aura.scale.setScalar(3.2); s.add(S.aura);
        S.starLight = new T.PointLight(new T.Color(C.teal), 0, 14, 1.6); s.add(S.starLight);
        S.trail = PF.three.particles(st, 160, { scene: s, size: 0.09, additive: true, color: (i) => (i % 4 ? C.teal : C.paper),
          pos: (i, t, o) => { const r = PF.random(i * 7 + 3), born = r() * LAND, age = t - born;
            if (age < 0 || age > 0.6 || t > LAND + 0.2) { o.x = 0; o.y = -50; o.z = 0; return; }
            const p = starPos(born); o.x = p[0] + (r() - 0.5) * 0.5; o.y = p[1] + (r() - 0.5) * 0.5 - age * 0.6; o.z = p[2] + (r() - 0.5) * 0.5; } });

        // The ingot, white hot, then its 64 voxels.
        S.ingotMat = PF.three.mat("glow", C.white, { emissiveIntensity: 1.12 });
        S.ingot = new T.Mesh(new T.BoxGeometry(INGOT, INGOT, INGOT), S.ingotMat); S.ingot.position.set(0, INGOT_Y, 0); s.add(S.ingot);
        S.heatLight = new T.PointLight(new T.Color(C.glow), 0, 9, 1.4); S.heatLight.position.set(0, 2.2, 1.2); s.add(S.heatLight);
        const n = 4, pitch = INGOT / n;
        S.voxMat = new T.MeshPhysicalMaterial({ color: 0xffffff, roughness: 0.35, metalness: 0.1, emissive: new T.Color(C.white), emissiveIntensity: 2.4 });
        S.vox = new T.InstancedMesh(new T.BoxGeometry(pitch * 0.9, pitch * 0.9, pitch * 0.9), S.voxMat, n * n * n);
        S.voxData = [];
        const vr = PF.random(9);
        for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) for (let k = 0; k < n; k++) {
          const home = [(i - 1.5) * pitch, (j - 1.5) * pitch, (k - 1.5) * pitch];
          const face = j === n - 1 ? C.top : k === n - 1 ? C.paper : i === n - 1 ? C.right : C.iron;
          const d = Math.hypot(home[0], home[2]) || 1;
          S.voxData.push({ home, vx: (home[0] / d) * (1.6 + vr() * 2.2), vy: 4.6 + vr() * 3.2 + home[1] * 2, vz: (home[2] / d) * (1.6 + vr() * 2.2) + (vr() - 0.5),
            spin: [(vr() - 0.5) * 9, (vr() - 0.5) * 9, (vr() - 0.5) * 9] });
          S.vox.setColorAt(S.voxData.length - 1, new T.Color(face));
        }
        s.add(S.vox);
        S.m4 = new T.Matrix4(); S.q = new T.Quaternion(); S.e = new T.Euler(); S.v = new T.Vector3(); S.sc = new T.Vector3();

        // The Forge cube, flat and exact once whole: top teal, left paper, right grey (unlit swatches).
        const flat = (hex) => new T.MeshBasicMaterial({ color: new T.Color(hex), toneMapped: false });
        S.cube = new T.Mesh(new T.BoxGeometry(FINAL, FINAL, FINAL), [flat(C.right), flat(C.iron), flat(C.top), flat(C.iron), flat(C.paper), flat(C.iron)]);
        S.cube.position.set(0, FINAL_Y, 0); s.add(S.cube);

        // The hammer: a handle and a head, swung from the smith's shoulder (off frame).
        S.hammer = new T.Group(); S.hammer.position.set(...PIVOT);
        const handle = new T.Mesh(new T.CylinderGeometry(0.075, 0.085, REACH, 14), PF.three.mat("gloss", C.pane));
        handle.rotation.z = Math.PI / 2; handle.position.x = REACH / 2;
        const head = new T.Mesh(new T.BoxGeometry(0.6, 1.0, 0.62), PF.three.mat("metal", C.paper, { roughness: 0.22 }));
        head.position.x = REACH;
        const band = new T.Mesh(new T.BoxGeometry(0.62, 0.16, 0.64), PF.three.mat("gloss", C.accent)); band.position.x = REACH;
        S.hammer.add(handle, head, band); s.add(S.hammer);
        const armLen = Math.hypot(SHOULDER[0] - PIVOT[0], SHOULDER[1] - PIVOT[1]);
        S.arm = new T.Mesh(new T.BoxGeometry(armLen, 0.62, 0.62), PF.three.mat("satin", C.paper));
        S.arm.position.set((PIVOT[0] + SHOULDER[0]) / 2, (PIVOT[1] + SHOULDER[1]) / 2, PIVOT[2]);
        S.arm.rotation.z = Math.atan2(SHOULDER[1] - PIVOT[1], SHOULDER[0] - PIVOT[0]);
        S.fist = new T.Mesh(new T.BoxGeometry(0.62, 0.62, 0.66), PF.three.mat("satin", C.paper)); S.fist.position.set(...PIVOT);
        s.add(S.arm, S.fist);

        // Sparks at the strike, in the heat ramp.
        S.sparks = PF.three.particles(st, 220, { scene: s, size: 0.08, additive: true, color: (i) => [C.white, C.glow, C.glow, C.ember][i % 4],
          pos: (i, t, o) => { const r = PF.random(i * 31 + 5), a = t - HIT, life = 0.4 + r() * 0.7;
            if (a < 0 || a > life) { o.x = 0; o.y = -50; o.z = 0; return; }
            const th = r() * Math.PI * 2, up = 3 + r() * 5, sp = 2 + r() * 5;
            o.x = Math.cos(th) * sp * a; o.y = ANVIL_TOP + INGOT + up * a - 6 * a * a; o.z = Math.sin(th) * sp * a; } });

        // The naming screen's question, word by word.
        "Hello. What should we call you?".split(" ").forEach((w, i) => { const sp = document.createElement("span"); sp.textContent = w; sp.style.marginRight = "0.26em"; $("#question").appendChild(sp); });
        // Measure the wordmark: "f", a slot for the cube, "rge", centred.
        const wf = PF.rectOf($("#wf")).w, wr = PF.rectOf($("#wrge")).w, oS = 190 * 0.64, gap = 6;
        const x0 = (W - (wf + oS + wr + gap * 2)) / 2;
        S.wm = { x0, wf, wr, oS, gap, cubeX: x0 + wf + gap, cubeY: 455 + 190 * 0.5 - oS * 0.42 };
        PF.debug({ grid: b, safe: CUES.safe });
      }

      // The star's fall: from off the top left to the anvil, speeding up.
      function starPos(t) {
        const u = easeIn(PF.clamp01(t / LAND));
        const p0 = [-7.5, 5.6, -1.6], pc = [-3.8, 4.6, -0.7], p1 = [0, INGOT_Y, 0];
        return [0, 1, 2].map((k) => (1 - u) * (1 - u) * p0[k] + 2 * (1 - u) * u * pc[k] + u * u * p1[k]);
      }
      function hammerAngle(t) {
        const w0 = b(3, 1), w1 = b(3, 3), s0 = HIT - 0.12;
        if (t < w0) return REST;
        if (t < w1) return REST + (BACK - REST) * easeIO(PF.progress(t, w0, w1 - w0));
        if (t < s0) return BACK;
        if (t < HIT) return BACK + (HITA - BACK) * easeIn(PF.progress(t, s0, HIT - s0));
        const a = t - HIT; return HITA + 12 * Math.sin(PF.clamp01(a / 0.35) * Math.PI) * (1 - PF.clamp01(a / 0.35));
      }
      // Where a voxel is: in the ingot, flying, hanging in slow motion, then home in the Forge cube.
      function voxelAt(v, t, out) {
        const peak = b(4, 2), turn = b(4, 4), whole = b(5, 1);
        if (t < HIT) { out.p = [v.home[0], INGOT_Y + v.home[1], v.home[2]]; out.r = [0, 0, 0]; out.s = 1; return; }
        const a = t - HIT, slow = peak - HIT, τ = a < slow ? a : slow + (a - slow) * 0.12;
        let p = [v.home[0] + v.vx * τ, INGOT_Y + v.home[1] + v.vy * τ - 4.9 * τ * τ, v.home[2] + v.vz * τ];
        let r = v.spin.map((s) => s * τ), s = 1;
        if (t >= turn) {
          const k = easeIO(PF.progress(t, turn, whole - turn)), f = FINAL / INGOT;
          const h = [v.home[0] * f, FINAL_Y + v.home[1] * f, v.home[2] * f];
          p = p.map((x, i) => x + (h[i] - x) * k); r = r.map((x) => x * (1 - k)); s = 1 + (f - 1) * k;
        }
        out.p = p; out.r = r; out.s = s;
      }

      function slam(id, t, at, until) {
        const s = PF.slam(t, at, { from: 1.25 }), on = t >= at && t < until + 0.18;
        PF.css($(id), { visibility: on ? "inherit" : "hidden" });
        if (on) PF.slamStyle($(id), s, { opacity: (s.opacity * (t > until ? 1 - (t - until) / 0.18 : 1)).toFixed(3) });
      }

      function draw(t) {
        const T = st.THREE, heat = heatAt(t);
        // The star falls, its aura and light sweep the floor; on landing it heats and closes into the ingot.
        const sp = starPos(Math.min(t, LAND)), forge = PF.progress(t, LAND, b(2, 3) - LAND);
        const starOn = t < b(2, 3);
        S.star.visible = S.aura.visible = starOn;
        S.star.position.set(...sp); S.star.rotation.set(t * 1.7, t * 2.3, t * 0.9);
        S.star.scale.setScalar(1 - 0.55 * forge);
        S.rockMat.emissive.set(forge > 0 ? glowing(C.iron, 0.4 + 0.6 * forge) : C.teal);
        S.rockMat.emissiveIntensity = 0.15 + 1.3 * forge;
        S.aura.position.set(...sp); S.aura.scale.setScalar(3.2 + 0.35 * Math.sin(t * 9));
        S.aura.material.opacity = 0.85 * (1 - forge); S.aura.material.color.set(PF.mix(C.teal, C.glow, forge));
        S.starLight.position.set(sp[0], sp[1] + 0.2, sp[2] + 0.4);
        S.starLight.intensity = starOn ? 30 * PF.clamp01(t / 0.4) * (1 - forge) : 0;
        S.trail.update(t);
        // The ingot, white hot from the landing to the strike.
        const ingotOn = t >= LAND + 0.2 && t < HIT;
        S.ingot.visible = ingotOn; S.ingot.scale.setScalar(easeOut(PF.progress(t, LAND + 0.2, 0.55)) || 0.001);
        S.heatLight.intensity = (ingotOn ? 7 : 0) + (t >= HIT ? 14 * heat : 0);
        S.heatLight.color.set(glowing(C.iron, Math.max(0.35, heat)));
        // The voxels: burst, hang, cool, rebuild.
        const voxOn = t >= HIT && t < b(5, 2);
        S.vox.visible = voxOn;
        if (voxOn) {
          const o = {};
          S.voxData.forEach((v, i) => { voxelAt(v, t, o); S.e.set(...o.r); S.q.setFromEuler(S.e); S.v.set(...o.p); S.sc.setScalar(o.s);
            S.m4.compose(S.v, S.q, S.sc); S.vox.setMatrixAt(i, S.m4); });
          S.vox.instanceMatrix.needsUpdate = true;
          S.voxMat.emissive.set(glowing(C.iron, heat)); S.voxMat.emissiveIntensity = 1.5 * heat;
          S.voxMat.color.set(heat > 0.12 ? C.iron : PF.mix("#ffffff", C.iron, heat / 0.12));
        }
        S.cube.visible = t >= b(5, 2);
        // The whole cube cools: its top glows ember to teal until COOLED.
        const coolTop = 1 - PF.clamp01((COOLED - t) / (COOLED - b(5, 2)));
        S.cube.material[2].color.set(t < COOLED ? PF.mix(glowing(C.iron, 0.3), C.top, coolTop) : C.top);
        S.cube.material[4].color.set(t < COOLED ? PF.mix(C.iron, C.paper, coolTop) : C.paper);
        S.cube.material[0].color.set(t < COOLED ? PF.mix(C.iron, C.right, coolTop) : C.right);
        // The hammer swings from the smith's shoulder.
        S.hammer.rotation.z = (hammerAngle(t) * Math.PI) / 180;
        S.hammer.visible = S.arm.visible = S.fist.visible = t >= b(3, 1) - 0.2 && t < HIT + 0.45;
        S.dots.update(t); S.sparks.update(t);

        // Camera: a new shot every two beats, each drifting; words only over the wide ones.
        const wide = (at, az, y, r, d) => ({ at, azimuth: az, elevation: 8, radius: r, target: [0, y, 0], drift: d });
        PF.three.shots(st.camera, t, [
          { at: 0, azimuth: -18, elevation: 16, radius: 15, target: [-1.5, 3, 0], drift: { azimuth: 8, radius: -2 } },
          { at: b(1, 3), azimuth: 12, elevation: 10, radius: 11, target: [-0.8, 2.2, 0], drift: { azimuth: -6, radius: -1.5 } },
          { at: LAND, azimuth: -26, elevation: 14, radius: 7.5, target: [0, 1.4, 0], drift: { azimuth: 9, radius: -0.8 } },
          wide(b(2, 3), 0, 3.6, 15, { radius: -1.2 }),
          { at: b(3, 1), azimuth: -2, elevation: 8, radius: 13.5, target: [-1.6, 3.1, 0], drift: { azimuth: 6, radius: -1 } },
          { at: b(3, 3), azimuth: 12, elevation: 6, radius: 12, target: [-1.8, 3.6, 0], drift: { azimuth: -4, radius: -0.6 } },
          { at: HIT, azimuth: -6, elevation: 11, radius: 9, target: [0, 2.0, 0], drift: { radius: -1.2 } },
          wide(b(4, 1), -22, 4.1, 17, { azimuth: 10 }),
          { at: b(4, 3), azimuth: 32, elevation: 22, radius: 11, target: [0, 3.2, 0], drift: { azimuth: 12, radius: -1 } },
          { at: b(5, 1), azimuth: 45, elevation: 26, radius: 13.5, target: [0, 3.7, 0], drift: { radius: -1 } },
          { at: COOLED, azimuth: 45, elevation: 35.26, radius: 7.2, target: [0, FINAL_Y, 0], drift: { radius: -0.6 } },
        ]);
        const sh = PF.shake(t, [LAND, HIT], { amp: 14, decay: 0.4 });
        st.camera.position.x += sh.x * 0.004; st.camera.position.y += sh.y * 0.004;
        st.render();

        // Words, slammed on the beat over the wide shots.
        slam("#w1", t, b(2, 3), b(3, 1) - 0.05);
        slam("#w2", t, b(4, 1), b(4, 4));
        slam("#w3", t, b(5, 1), COOLED);
        const ck = PF.progress(t, b(5, 2), 0.25);
        PF.css($("#check"), { visibility: t >= b(5, 2) && t < COOLED + 0.18 ? "inherit" : "hidden", left: `${(W + 820) / 2 + 30}px`, top: "170px" });
        $("#check path").setAttribute("stroke-dasharray", `${ck.toFixed(3)} 1`);

        // The lockup and the naming screen, on the app's stage.
        const lock = PF.progress(t, LOCK, 0.4);
        PF.css($("#lockup"), { visibility: t >= LOCK ? "inherit" : "hidden" });
        PF.flood($("#lockup"), easeIO(lock), "up");
        const wmIn = easeOut(PF.progress(t, LOCK + 0.15, 0.5)), part = easeIO(PF.progress(t, PART, 0.7));
        const m = S.wm, out = 1 - PF.clamp01(part * 2);
        PF.css($("#wf"), { left: `${m.x0 + 50 * (1 - wmIn) - 160 * part}px`, opacity: (wmIn * out).toFixed(3) });
        PF.css($("#wrge"), { left: `${m.x0 + m.wf + m.oS + m.gap * 2 - 50 * (1 - wmIn) + 160 * part}px`, opacity: (wmIn * out).toFixed(3) });
        PF.css($("#tag"), { opacity: (PF.progress(t, b(6, 2), 0.4) * out).toFixed(3) });
        // The cube: in the wordmark's o, then up to the naming screen's hero.
        const hx = W / 2 - 66, hy = 322 - 66;
        const mx = PF.lerp(m.cubeX, hx, part), my = PF.lerp(m.cubeY, hy, part), ms = PF.lerp(m.oS, 132, part) / 132;
        PF.css($("#mark"), { visibility: t >= LOCK + 0.15 ? "inherit" : "hidden", opacity: wmIn.toFixed(3), transform: `translate(${mx.toFixed(2)}px, ${my.toFixed(2)}px) scale(${ms.toFixed(4)})` });
        const nm = PF.progress(t, PART + 0.4, 0.6);
        PF.css($("#titlebar"), { opacity: nm.toFixed(3) });
        PF.css($("#orbit"), { opacity: PF.progress(t, PART + 0.5, 0.6).toFixed(3) });
        const ang = ((t - PART) / 7) * Math.PI * 2;
        $("#spark").setAttribute("cx", (960 + 117 * Math.cos(ang)).toFixed(2)); $("#spark").setAttribute("cy", (388 + 34 * Math.sin(ang)).toFixed(2));
        [...$("#question").children].forEach((sp, i) => { const e = easeOut(PF.progress(t, NAME - 0.2 + i * 0.07, 0.42));
          PF.css(sp, { opacity: e.toFixed(3), transform: `translateY(${(12 * (1 - e)).toFixed(2)}px)` }); });
        const fe = easeOut(PF.progress(t, NAME + 0.3, 0.6)), pulse = 0.5 + 0.5 * Math.sin((t - NAME) * 2.6);
        PF.css($("#field"), { opacity: fe.toFixed(3), transform: `translateY(${(15 * (1 - fe)).toFixed(2)}px)`, borderColor: PF.mix(C.right, C.teal, 0.45 + 0.55 * pulse), boxShadow: `0 0 20px rgba(142,202,205,${(0.25 * pulse).toFixed(3)})` });

        // The viewfinder over the 3D chapters only.
        const ch = t < LAND ? "01 — Star" : t < b(3, 1) ? "02 — Land" : t < b(4, 1) ? "03 — Strike" : t < b(5, 1) ? "04 — Shatter" : "05 — Approve";
        hud.set({ tl: ch, tr: "Forge", bl: heat > 0.05 && t > LAND ? `${Math.round(400 + 1100 * heat)}°C` : t < LAND ? "incoming" : "cool", br: PF.timecode(t, 30) }, t);
        PF.css(hud.el, { opacity: (1 - PF.progress(t, LOCK, 0.3)).toFixed(3) });
        PF.grain($("#grain"), t, { alpha: 0.05 });
      }

      PF.film({
        duration: CUES.duration,
        setup,
        draw,
        waitFor: [PF.signal("three")],
        register: (tl) => {
          window.__timelines["main"] = tl;
        },
      });
    </script>
  </body>
</html>
